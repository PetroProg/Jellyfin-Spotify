version: '3.8'

services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin-audio
    restart: unless-stopped
    ports:
      - "8096:8096"
    volumes:
      - ./data/jellyfin/config:/config
      - ./data/jellyfin/cache:/cache
      - ./music:/music:ro
    environment:
      - JELLYFIN_PublishedServerUrl=http://100.107.4.120:8096
      - JELLYFIN_FFmpeg__AllowTranscoding=false
    deploy:
      resources:
        limits:
          memory: 450M

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jellyfin-spotify-app
    restart: unless-stopped
    ports:
      - "5050:5050"
    volumes:
      - ./data:/app/data
      - ./music:/app/music
    environment:
      - NODE_ENV=production
      - PORT=5050
      - DB_PATH=/app/data/app.db
      - MUSIC_DIR=/app/music
      - JELLYFIN_URL=http://jellyfin:8096
      - JELLYFIN_PUBLIC_URL=http://100.107.4.120:8096
      - NOTIFY_PHONE_IP=100.76.188.111
      - JWT_SECRET=catppuccin-jellyfin-spotify-secret-key-change-in-prod
    depends_on:
      - jellyfin
    deploy:
      resources:
        limits:
          memory: 250M
