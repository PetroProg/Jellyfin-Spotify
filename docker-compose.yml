services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin-audio
    restart: unless-stopped
    ports:
      - "8096:8096"
    volumes:
      - ./data/jellyfin/config:/config
      - ./data/jellyfin/cache:/cache
      - ./music:/music:ro
    environment:
      - JELLYFIN_PublishedServerUrl=http://100.107.4.120:8096
      - JELLYFIN_FFmpeg__AllowTranscoding=false
    deploy:
      resources:
        limits:
          memory: 450M

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jellyfin-spotify-app
    restart: unless-stopped
    ports:
      - "5050:5050"
    volumes:
      - ./data:/app/data
      - ./music:/app/music
    environment:
      - NODE_ENV=production
      - NODE_OPTIONS=--max-old-space-size=350
      - PORT=5050
      - DB_PATH=/app/data/app.db
      - MUSIC_DIR=/app/music
      - JELLYFIN_URL=http://jellyfin:8096
      - JELLYFIN_PUBLIC_URL=http://100.107.4.120:8096
      - NOTIFY_PHONE_IP=100.76.188.111
      - JWT_SECRET=${JWT_SECRET:-}
      - WEEKLY_REPORT_ENABLED=${WEEKLY_REPORT_ENABLED:-true}
      - WEEKLY_REPORT_TO=${WEEKLY_REPORT_TO:-}
      - WEEKLY_REPORT_TIMEZONE=${WEEKLY_REPORT_TIMEZONE:-Europe/Zurich}
      - WEEKLY_REPORT_DAY=${WEEKLY_REPORT_DAY:-0}
      - WEEKLY_REPORT_HOUR=${WEEKLY_REPORT_HOUR:-12}
      - WEEKLY_REPORT_MINUTE=${WEEKLY_REPORT_MINUTE:-0}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_SECURE=${SMTP_SECURE:-true}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
    depends_on:
      - jellyfin
    deploy:
      resources:
        limits:
          memory: 500M
